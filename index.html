<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт рекламы в канале</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --ink:#142230; --muted:#5B6B79; --line:#D6DEE4;
  --accent:#1D7BC4; --accent-ink:#FFFFFF; --accent-soft:#DCEBF7;
  --good:#16794F; --good-bg:#DCF1E7; --bad:#B23838; --bad-bg:#F7E0E0; --warn:#8A6410; --warn-bg:#F6EBC9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A24; --surface:#17252F; --ink:#E7EEF3; --muted:#93A3B1; --line:#27384A;
    --accent:#4AA3E8; --accent-ink:#06121C; --accent-soft:#183247;
    --good:#58D19A; --good-bg:#15382B; --bad:#F08A8A; --bad-bg:#3E2024; --warn:#E5C467; --warn-bg:#3A3118;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A24; --surface:#17252F; --ink:#E7EEF3; --muted:#93A3B1; --line:#27384A;
  --accent:#4AA3E8; --accent-ink:#06121C; --accent-soft:#183247;
  --good:#58D19A; --good-bg:#15382B; --bad:#F08A8A; --bad-bg:#3E2024; --warn:#E5C467; --warn-bg:#3A3118;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;line-height:1.2;margin:2px 0 12px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:20px 0 8px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.tab{border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--warn);color:var(--surface);font-size:12.5px;line-height:20px}
.tab[aria-selected="true"] .badge{background:var(--accent-ink);color:var(--accent)}

.banner{background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:14.5px}
.banner b{display:block;margin-bottom:2px}
.banner .btn{margin-top:8px}

.bar{display:flex;gap:8px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 11px;font-size:14px;font-weight:500}
select.btn{appearance:none;-webkit-appearance:none;font-weight:500;padding-right:12px;max-width:100%}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools.three{grid-template-columns:1fr 1fr 1fr}

.card{background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 12px 10px;margin-bottom:10px}
.card.good{border-left-color:var(--good)} .card.bad{border-left-color:var(--bad)} .card.due{border-left-color:var(--warn)} .card.mid{border-left-color:var(--line)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.price{font-weight:700;white-space:nowrap}
.st{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;margin-top:8px}
.st.due{background:var(--warn-bg);color:var(--warn)} .st.run{background:var(--accent-soft);color:var(--accent)} .st.plan{background:var(--bg);color:var(--muted)} .st.ok{background:var(--good-bg);color:var(--good)}
.res{display:flex;gap:16px;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.res b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 6px}
.tile{display:block;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%}
.tl{display:block;font-size:12.5px;color:var(--muted)}
.tl b{color:var(--ink);font-weight:700}
.tv{display:block;font-size:16.5px;font-weight:700;margin-top:1px}
.tv.good{color:var(--good)} .tv.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.spacer{flex:1}
.link{background:none;border:0;color:var(--accent);padding:6px 4px;font-size:14px;font-weight:500}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.status{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}

.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;text-align:left;width:100%}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.key span{color:inherit;opacity:.85}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.panel p{margin:0 0 6px;font-size:14.5px}
.panel p:last-child{margin-bottom:0}
.panel .k{color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
.rrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rrow:first-child{border-top:0}
.rk{flex:0 0 22px;color:var(--muted);font-weight:600;font-size:14px}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:12.5px;color:var(--muted)}
.rbar{height:5px;background:var(--bg);border-radius:3px;margin-top:5px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rval{font-weight:700;white-space:nowrap}
.g{border-top:1px solid var(--line);padding:10px 0}
.g:first-child{border-top:0}
.g .gn{font-weight:600;overflow-wrap:anywhere}
.g .gm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.g .gm div{font-size:12.5px;color:var(--muted)}
.g .gm b{display:block;color:var(--ink);font-size:15px}
.g .gs{font-size:12.5px;color:var(--muted);margin-top:2px}
.thin{font-size:12px;color:var(--warn)}

.overlay{position:fixed;inset:0;background:rgba(5,12,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:19px;margin:0 0 4px}
.sheet h4{font-size:15px;margin:16px 0 2px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 6px}
label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
input,select.field,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;margin-top:16px}
details{margin-top:12px}
summary{color:var(--accent);cursor:pointer;font-size:14px}
.sect{margin-top:16px;padding-top:4px;border-top:1px solid var(--line)}
.gl{margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl b{font-size:15.5px}
.gl p{margin:2px 0 0;font-size:14px}
.gl .f{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Учёт рекламы в канале</h1>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabBuys" data-tab="buys" aria-selected="true" type="button">Закупки<span class="badge" id="dueBadge" hidden></span></button>
    <button class="tab" role="tab" id="tabStats" data-tab="stats" aria-selected="false" type="button">Статистика</button>
  </div>

  <section id="viewBuys">
    <div id="banner"></div>
    <div class="bar">
      <button class="btn primary" id="addBtn" type="button">Добавить закупку</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Поиск по каналу или контакту" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <select class="btn" id="sortSel" aria-label="Сортировка">
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
        <option value="cps_best">Лучшая цена подписчика</option>
        <option value="cps_worst">Худшая цена подписчика</option>
        <option value="cpm_best">Лучший CPM</option>
        <option value="cr_best">Лучшая конверсия</option>
        <option value="reach_desc">Больше охват</option>
        <option value="price_desc">Дороже</option>
        <option value="price_asc">Дешевле</option>
      </select>
      <button class="btn" id="glossBtn" type="button">Что значат метрики</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="viewStats" hidden>
    <div class="tools">
      <select class="btn" id="stPeriod" aria-label="Период">
        <option value="all">Всё время</option>
        <option value="7">7 дней</option>
        <option value="30">30 дней</option>
        <option value="90">90 дней</option>
      </select>
      <select class="btn" id="stFormat" aria-label="Формат"></select>
    </div>
    <div id="stBody"></div>
  </section>

  <div class="row" style="justify-content:center;margin-top:12px">
    <button class="btn small" id="exportBtn" type="button">Выгрузить таблицу (CSV)</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h3 id="sheetTitle">Новая закупка</h3>
    <p class="lead" id="sheetLead">Заполните при покупке. Охват и подписчиков внесёте после выхода поста.</p>

    <label for="fAt">Дата и время выхода поста</label>
    <input id="fAt" type="datetime-local">

    <label for="fChannel">Канал (название)</label>
    <input id="fChannel" type="text" placeholder="Название канала" autocomplete="off">

    <div class="two">
      <div>
        <label for="fSubs">Подписчиков в канале</label>
        <input id="fSubs" type="number" inputmode="numeric" min="0" placeholder="12400">
      </div>
      <div>
        <label for="fLink">Ссылка на канал</label>
        <input id="fLink" type="text" placeholder="t.me/name, по желанию" autocomplete="off">
      </div>
    </div>

    <label for="fFormat">Формат</label>
    <select id="fFormat" class="field"></select>

    <div class="two">
      <div>
        <label for="fPrice">Цена покупки, ₽</label>
        <input id="fPrice" type="number" inputmode="decimal" min="0" placeholder="5000">
      </div>
      <div>
        <label for="fContact">У кого покупали</label>
        <input id="fContact" type="text" placeholder="@username" autocomplete="off" autocapitalize="off">
      </div>
    </div>

    <div class="sect">
      <h4>Результаты</h4>
      <p class="lead" id="resLead">Внесите через сутки после выхода поста.</p>
      <div class="two">
        <div>
          <label for="fReach">Охват поста</label>
          <input id="fReach" type="number" inputmode="numeric" min="0" placeholder="3200">
        </div>
        <div>
          <label for="fJoined">Пришло подписчиков</label>
          <input id="fJoined" type="number" inputmode="numeric" min="0" placeholder="140">
        </div>
      </div>
    </div>

    <details>
      <summary>Дополнительно</summary>
      <label for="fInvite">Пригласительная ссылка этой закупки</label>
      <input id="fInvite" type="text" placeholder="t.me/+..." autocomplete="off">
      <div class="hint">Отдельная ссылка на каждую закупку показывает, сколько подписчиков пришло именно с неё.</div>
      <label for="fNote">Заметка</label>
      <textarea id="fNote" maxlength="600" placeholder="Условия, что сработало"></textarea>
    </details>

    <div class="actions">
      <button class="btn primary" id="saveBtn" type="button">Сохранить</button>
      <button class="btn" id="cancelBtn" type="button">Отмена</button>
      <button class="btn danger" id="delBtn" type="button" style="display:none">Удалить</button>
    </div>
  </div>
</div>

<div class="overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="sheet">
    <h3 id="infoTitle"></h3>
    <div id="infoBody"></div>
    <div class="actions"><button class="btn primary" id="infoClose" type="button">Понятно</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  'use strict';
  var KEY = 'tg-ad-tracker-v1';
  var DAY = 86400000;
  var FORMATS = ['Пост в ленте 24 ч', 'Пост в ленте 48 ч', 'Закреп', 'Репост', 'Другое'];

  var items = [];
  var editingId = null;
  var S = {
    tab: 'buys', buyFilter: 'all', stPeriod: 'all', stFormat: 'all',
    rankMetric: 'cps', rankDir: 'best', rankAll: false,
    groupBy: 'channel', groupSort: 'cps_best'
  };
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);
  var apiOn = false, apiDenied = false, inflight = 0, known = {};
  var storageMode = 'local';
  var lastSig = '';
  if (inTg) {
    try { tg.ready(); tg.expand(); document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light'); } catch(e){}
  }

  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v){ if (v === '' || v == null) return null; var n = Number(v); return isFinite(n) ? n : null; }
  function fmt(n){ return n == null ? '—' : Math.round(n).toLocaleString('ru-RU'); }
  function money(n){ return n == null ? '—' : Math.round(n).toLocaleString('ru-RU') + ' ₽'; }
  function money2(n){ return n == null ? '—' : n.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₽'; }
  function pct(n, d){ return n == null ? '—' : n.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d}) + '%'; }
  function pad(n){ return String(n).length < 2 ? '0' + n : String(n); }
  function toLocalInput(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function nowLocal(){ var d = new Date(); d.setSeconds(0, 0); return toLocalInput(d); }
  function fdt(s){ var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(s || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] + ' ' + m[4] + ':' + m[5] : (s || ''); }
  function fd(s){ var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(s || ''); return m ? m[3] + '.' + m[2] : ''; }
  function uid(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function dur(ms){ var m = Math.max(Math.round(ms / 60000), 0), h = Math.floor(m / 60); m = m % 60; return (h ? h + ' ч ' : '') + m + ' мин'; }
  function pl(n, a, b, c){ var m = n % 100, k = n % 10; if (m > 10 && m < 20) return c; if (k === 1) return a; if (k >= 2 && k <= 4) return b; return c; }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function sum(list, f){ var s = 0; list.forEach(function(x){ s += (f(x) || 0); }); return s; }

  // ---------- data model ----------
  function normalize(r){
    var it = {}, k;
    for (k in r) it[k] = r[k];
    if (!it.at && it.date) it.at = it.date + 'T12:00';
    if (it.at && it.at.length === 10) it.at += 'T12:00';
    if (it.left && it.joined != null) it.joined = Math.max(it.joined - it.left, 0);
    delete it.left; delete it.verdict; delete it.date;
    if (it.chSubs === undefined) it.chSubs = null;
    it.contact = it.contact || '';
    it.link = it.link || '';
    it.format = it.format || '';
    return it;
  }
  function ts(it){ var t = Date.parse(it.at); return isFinite(t) ? t : 0; }
  function done(it){ return it.reach != null && it.joined != null; }
  function status(it){
    if (done(it)) return 'done';
    var t = ts(it), now = Date.now();
    if (t > now) return 'planned';
    if (now - t >= DAY) return 'due';
    return 'running';
  }

  // ---------- metrics ----------
  var M = {
    cps: {name: 'CPS', title: 'Цена подписчика', better: 'low', fmt: money,
      fn: function(it){ return it.joined > 0 ? it.price / it.joined : null; },
      calc: function(it){ return fmt(it.price) + ' ₽ ÷ ' + fmt(it.joined) + ' подписчиков'; },
      formula: 'Цена закупки ÷ пришедшие подписчики',
      desc: 'Сколько вы заплатили за одного нового подписчика. Главная метрика для сравнения каналов: чем меньше, тем лучше.'},
    cpm: {name: 'CPM', title: 'Цена 1000 охвата', better: 'low', fmt: money,
      fn: function(it){ return it.reach > 0 ? it.price / it.reach * 1000 : null; },
      calc: function(it){ return fmt(it.price) + ' ₽ ÷ ' + fmt(it.reach) + ' × 1000'; },
      formula: 'Цена закупки ÷ охват × 1000',
      desc: 'Цена за тысячу людей, увидевших пост. Показывает, насколько дёшево канал даёт показы. Чем меньше, тем лучше. Не учитывает, подписались ли люди.'},
    cpv: {name: 'CPV', title: 'Цена просмотра', better: 'low', fmt: money2,
      fn: function(it){ return it.reach > 0 ? it.price / it.reach : null; },
      calc: function(it){ return fmt(it.price) + ' ₽ ÷ ' + fmt(it.reach) + ' просмотров'; },
      formula: 'Цена закупки ÷ охват',
      desc: 'Цена одного просмотра поста. То же, что CPM, но за одного человека. Чем меньше, тем лучше.'},
    cr: {name: 'CR', title: 'Конверсия в подписку', better: 'high', fmt: function(v){ return pct(v, 2); },
      fn: function(it){ return it.reach > 0 ? it.joined / it.reach * 100 : null; },
      calc: function(it){ return fmt(it.joined) + ' ÷ ' + fmt(it.reach) + ' × 100'; },
      formula: 'Пришедшие подписчики ÷ охват × 100',
      desc: 'Какая доля увидевших пост подписалась. Показывает, насколько реклама и аудитория канала вам подходят. Чем больше, тем лучше. Низкий CR при хорошем CPM значит, что показы дешёвые, но аудитория не ваша или реклама слабая.'},
    err: {name: 'ERR', title: 'Охват от аудитории канала', better: 'high', fmt: function(v){ return pct(v, 1); },
      fn: function(it){ return (it.chSubs > 0 && it.reach != null) ? it.reach / it.chSubs * 100 : null; },
      calc: function(it){ return fmt(it.reach) + ' ÷ ' + fmt(it.chSubs) + ' × 100'; },
      formula: 'Охват поста ÷ подписчики канала × 100',
      desc: 'Какая часть подписчиков канала увидела ваш пост. Если число очень низкое, в канале много неживой аудитории или реклама быстро ушла из ленты. Чем больше, тем лучше.'},
    reach: {name: 'Охват', title: 'Охват', better: 'high', fmt: fmt,
      fn: function(it){ return it.reach; },
      calc: function(it){ return fmt(it.reach) + ' просмотров'; },
      formula: 'Просмотры поста за выбранный срок',
      desc: 'Сколько раз просмотрен пост. Вы вносите это число после выхода рекламы.'},
    joined: {name: 'Пришло', title: 'Пришло подписчиков', better: 'high', fmt: fmt,
      fn: function(it){ return it.joined; },
      calc: function(it){ return fmt(it.joined) + ' подписчиков'; },
      formula: 'Новые подписчики по этой закупке',
      desc: 'Сколько человек подписалось на ваш канал после этой рекламы.'}
  };
  var CARD_METRICS = ['cps', 'cpm', 'cr', 'err'];

  function agg(list){
    var c = list.filter(done);
    var price = sum(c, function(x){ return x.price; });
    var reach = sum(c, function(x){ return x.reach; });
    var joined = sum(c, function(x){ return x.joined; });
    var withSubs = c.filter(function(x){ return x.chSubs > 0; });
    var errR = sum(withSubs, function(x){ return x.reach; });
    var errS = sum(withSubs, function(x){ return x.chSubs; });
    return {
      n: list.length, nDone: c.length,
      spent: sum(list, function(x){ return x.price; }), spentDone: price,
      reach: reach, joined: joined,
      cps: joined > 0 ? price / joined : null,
      cpm: reach > 0 ? price / reach * 1000 : null,
      cpv: reach > 0 ? price / reach : null,
      cr: reach > 0 ? joined / reach * 100 : null,
      err: errS > 0 ? errR / errS * 100 : null
    };
  }
  function tone(key, val, A){
    if (val == null || !A || A.nDone < 2 || A[key] == null) return '';
    var r = val / A[key];
    if (M[key].better === 'low') { if (r <= 0.9) return 'good'; if (r >= 1.1) return 'bad'; }
    else { if (r >= 1.1) return 'good'; if (r <= 0.9) return 'bad'; }
    return '';
  }

  // ---------- storage / sync ----------
  function setStatus(){
    var t;
    if (apiDenied) t = 'Доступ закрыт: к этой базе уже подключены два аккаунта Telegram.';
    else if (storageMode === 'cloud') t = 'Общая база на вашем сервере: данные видны вам и компаньону и обновляются сами.';
    else t = 'Нет связи с сервером, данные хранятся только на этом устройстве.';
    $('status').textContent = t;
  }
  function readLocal(){
    try { var raw = localStorage.getItem(KEY); var p = raw ? JSON.parse(raw) : null; return (p && Array.isArray(p.items)) ? p.items.map(normalize) : []; }
    catch(e){ return []; }
  }
  function writeLocal(){ try { localStorage.setItem(KEY, JSON.stringify({items: items})); } catch(e){} }
  function api(method, path, body){
    return fetch(path, {
      method: method,
      headers: {'X-Init-Data': (tg && tg.initData) || '', 'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store'
    }).then(function(r){
      if (r.status === 403) apiDenied = true;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function fin(){ inflight--; }
  function failed(){ toast('Не удалось сохранить на сервер, попробуйте ещё раз'); }
  function persist(){
    writeLocal();
    if (!apiOn) return;
    var next = {};
    items.forEach(function(it){ next[it.id] = JSON.stringify(it); });
    Object.keys(next).forEach(function(id){
      if (known[id] === next[id]) return;
      inflight++;
      api('PUT', '/api/item', JSON.parse(next[id])).then(function(){ known[id] = next[id]; }).catch(failed).then(fin);
    });
    Object.keys(known).forEach(function(id){
      if (id in next) return;
      inflight++;
      api('DELETE', '/api/item?id=' + encodeURIComponent(id)).then(function(){ delete known[id]; }).catch(failed).then(fin);
    });
  }
  function pull(first){
    if (inflight > 0) return Promise.resolve();
    return api('GET', '/api/items').then(function(res){
      var srv = ((res && res.items) || []).map(normalize);
      var migrated = false;
      try { migrated = localStorage.getItem(KEY + '-migrated') === '1'; } catch(e){}
      apiOn = true; storageMode = 'cloud'; apiDenied = false;
      if (first && !srv.length && items.length && !migrated) { known = {}; persist(); }
      else {
        items = srv; known = {};
        srv.forEach(function(it){ known[it.id] = JSON.stringify(it); });
        writeLocal();
      }
      try { localStorage.setItem(KEY + '-migrated', '1'); } catch(e){}
      setStatus(); render();
    });
  }

  // ---------- links ----------
  function normLink(s){
    s = (s || '').trim();
    if (!s) return '';
    if (s.charAt(0) === '@') s = 't.me/' + s.slice(1);
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    return /^https?:\/\/[^\s]+$/i.test(s) ? s : '';
  }
  function normContact(s){
    s = (s || '').trim().replace(/^https?:\/\/(t\.me|telegram\.me)\//i, '').replace(/\s+/g, '');
    if (!s) return '';
    return s.charAt(0) === '@' ? s : '@' + s;
  }

  // ---------- render: buys ----------
  function sortList(list, mode){
    var a = list.slice();
    function byMetric(key, dir){
      a.sort(function(x, y){
        var vx = M[key].fn(x), vy = M[key].fn(y);
        if (vx == null && vy == null) return ts(y) - ts(x);
        if (vx == null) return 1; if (vy == null) return -1;
        return dir === 'low' ? vx - vy : vy - vx;
      });
    }
    if (mode === 'old') a.sort(function(x, y){ return ts(x) - ts(y); });
    else if (mode === 'cps_best') byMetric('cps', 'low');
    else if (mode === 'cps_worst') byMetric('cps', 'high');
    else if (mode === 'cpm_best') byMetric('cpm', 'low');
    else if (mode === 'cr_best') byMetric('cr', 'high');
    else if (mode === 'reach_desc') byMetric('reach', 'high');
    else if (mode === 'price_desc') a.sort(function(x, y){ return y.price - x.price; });
    else if (mode === 'price_asc') a.sort(function(x, y){ return x.price - y.price; });
    else a.sort(function(x, y){ return ts(y) - ts(x); });
    return a;
  }

  function renderBuys(){

  // ---------- render: stats ----------
  function groupKey(it, by){
    if (by === 'format') return it.format || 'Без формата';
    if (by === 'contact') return it.contact ? it.contact.toLowerCase() : 'Без контакта';
    return (it.channel || '').trim().toLowerCase();
  }
  function groupLabel(it, by){
    if (by === 'format') return it.format || 'Без формата';
    if (by === 'contact') return it.contact || 'Без контакта';
    return it.channel;
  }
  function buildGroups(list, by){
    var map = {}, order = [];
    list.forEach(function(it){
      var k = groupKey(it, by);
      if (!map[k]) { map[k] = {label: groupLabel(it, by), items: []}; order.push(k); }
      map[k].items.push(it);
    });
    return order.map(function(k){ var g = map[k]; g.a = agg(g.items); return g; });
  }
  var GSORT = {
    cps_best: ['cps', 'low'], cps_worst: ['cps', 'high'], cr_best: ['cr', 'high'], cpm_best: ['cpm', 'low'],
    spent: ['spent', 'high'], n: ['n', 'high'], joined: ['joined', 'high']
  };
  function sortGroups(gs, mode){
    var p = GSORT[mode] || GSORT.cps_best;
    return gs.slice().sort(function(x, y){
      var vx = x.a[p[0]], vy = y.a[p[0]];
      if (vx == null && vy == null) return 0;
      if (vx == null) return 1; if (vy == null) return -1;
      return p[1] === 'low' ? vx - vy : vy - vx;
    });
  }
  function chartHtml(doneList, A){
    var pts = doneList.filter(function(it){ return M.cps.fn(it) != null; }).sort(function(a, b){ return ts(a) - ts(b); }).slice(-24);
    if (pts.length < 2) return '';
    var W = 320, H = 140, pt = 14, pb = 24, pl = 4, pr = 4, n = pts.length;
    var vals = pts.map(function(it){ return M.cps.fn(it); });
    var max = Math.max.apply(null, vals.concat([A.cps || 0])) * 1.15;
    var bw = (W - pl - pr) / n, ph = H - pt - pb;
    var bars = pts.map(function(it, i){
      var v = vals[i], h = Math.max(v / max * ph, 2), x = pl + i * bw + bw * 0.15, y = H - pb - h;
      var tn = tone('cps', v, A), col = tn === 'good' ? 'var(--good)' : tn === 'bad' ? 'var(--bad)' : 'var(--accent)';
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.7).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + col + '"><title>' + esc(it.channel) + ': ' + money(v) + '</title></rect>';
    }).join('');
    var ay = H - pb - (A.cps / max * ph);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Цена подписчика по закупкам">' + bars +
      '<line x1="0" x2="' + W + '" y1="' + ay.toFixed(1) + '" y2="' + ay.toFixed(1) + '" stroke="var(--muted)" stroke-dasharray="4 3"/>' +
      '<text x="' + (W - 2) + '" y="' + (ay - 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">средняя ' + esc(money(A.cps)) + '</text>' +
      '<text x="' + pl + '" y="' + (H - 7) + '" font-size="10" fill="var(--muted)">' + fd(pts[0].at) + '</text>' +
      '<text x="' + (W - pr) + '" y="' + (H - 7) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + fd(pts[n - 1].at) + '</text></svg>';
  }
  function insightsHtml(list){
    var out = [];

    }

  }

      '<select class="btn" id="rankMetric" aria-label="Метрика">' + ['cps', 'cpm', 'cr', 'err', 'reach', 'joined', 'cpv'].map(function(k){
        return '<option value="' + k + '"' + (k === rm ? ' selected' : '') + '>' + M[k].name + (k === 'reach' || k === 'joined' ? '' : ', ' + M[k].title.toLowerCase()) + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn" id="rankDir">' + (S.rankDir === 'best' ? 'Лучшие' : 'Худшие') + '</button>' +
      '<button type="button" class="btn" id="rankAll">' + (S.rankAll ? 'Свернуть' : 'Все ' + rl.length) + '</button></div>' +
      '<div class="panel" style="padding-top:4px;padding-bottom:4px">' + (shown.length ? shown.map(function(it, i){
        var v = mm.fn(it), w = maxV > 0 ? Math.max(v / maxV * 100, 3) : 3;
        return '<button type="button" class="rrow" data-rowid="' + esc(it.id) + '"><span class="rk">' + (i + 1) + '</span><span class="rmain"><span class="rname">' + esc(it.channel) + '</span><br><span class="rsub">' +
          esc(fd(it.at) + (it.format ? ', ' + it.format : '') + ', ' + money(it.price)) + '</span><span class="rbar" style="display:block"><i style="width:' + w.toFixed(0) + '%"></i></span></span><span class="rval">' + mm.fmt(v) + '</span></button>';
      }).join('') : '<p class="k" style="padding:8px 0">Нет закупок с этой метрикой.</p>') + '</div>';

    // groups
    var gs = sortGroups(buildGroups(list, S.groupBy), S.groupSort);
    h += '<h2>Разбивка</h2><div class="tools" style="margin-bottom:8px">' +
      '<select class="btn" id="groupBy" aria-label="Группировать по">' + [['channel', 'По каналам'], ['format', 'По форматам'], ['contact', 'По продавцам']].map(function(p){ return '<option value="' + p[0] + '"' + (S.groupBy === p[0] ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') + '</select>' +
      '<select class="btn" id="groupSort" aria-label="Сортировка">' + [['cps_best', 'Лучшая цена подписчика'], ['cps_worst', 'Худшая цена подписчика'], ['cr_best', 'Лучшая конверсия'], ['cpm_best', 'Лучший CPM'], ['spent', 'Больше потрачено'], ['n', 'Больше закупок'], ['joined', 'Больше подписчиков']].map(function(p){ return '<option value="' + p[0] + '"' + (S.groupSort === p[0] ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') + '</select></div>' +
      '<div class="panel" style="padding-top:2px;padding-bottom:2px">' + gs.map(function(g){
        var a = g.a;
        return '<div class="g"><div class="gn">' + esc(g.label) + '</div><div class="gs">' + a.n + ' ' + pl(a.n, 'закупка', 'закупки', 'закупок') + ', потрачено ' + money(a.spent) + ', пришло ' + fmt(a.joined) +
          (a.nDone < a.n ? ', с результатами ' + a.nDone : '') + '</div>' +
          (a.nDone === 1 ? '<div class="thin">Мало данных: одна закупка</div>' : '') +
          '<div class="gm"><div>CPS<b>' + money(a.cps) + '</b></div><div>CPM<b>' + money(a.cpm) + '</b></div><div>CR<b>' + pct(a.cr, 2) + '</b></div></div></div>';
      }).join('') + '</div>';
    $('stBody').innerHTML = h;
  }

  // ---------- info / glossary ----------
  function openInfo(title, html){ $('infoTitle').textContent = title; $('infoBody').innerHTML = html; $('infoOverlay').classList.add('open'); }
  function closeInfo(){ $('infoOverlay').classList.remove('open'); }
  function showMetric(key, itemId){
    var m = M[key], it = itemId ? items.filter(function(x){ return x.id === itemId; })[0] : null;
    var h = '<p class="lead"><b>' + esc(m.formula) + '</b></p><p>' + esc(m.desc) + '</p>';
    if (it && m.fn(it) != null) h += '<h4>В этой закупке</h4><p>' + esc(m.calc(it)) + ' = <b>' + esc(m.fmt(m.fn(it))) + '</b></p>';
    h += '<p class="lead" style="margin-top:10px">' + (m.better === 'low' ? 'Лучше, когда число меньше.' : 'Лучше, когда число больше.') + ' Цвет на карточке показывает отличие от вашей средней: зелёный лучше на 10% и более, красный хуже.</p>';
    openInfo(m.name + ', ' + m.title.toLowerCase(), h);
  }
  function showGlossary(){
    var h = ['cps', 'cpm', 'cpv', 'cr', 'err', 'reach', 'joined'].map(function(k){
      var m = M[k];
      return '<div class="gl"><b>' + m.name + '</b>, ' + esc(m.title.toLowerCase()) + '<p class="f">' + esc(m.formula) + '</p><p>' + esc(m.desc) + '</p></div>';
    }).join('');
    openInfo('Что значат метрики', h);
  }

  // ---------- form ----------
  function fillFormatOptions(selected){
    var opts = FORMATS.slice();
    if (selected && opts.indexOf(selected) < 0) opts.push(selected);
    $('fFormat').innerHTML = opts.map(function(f){ return '<option value="' + esc(f) + '">' + esc(f) + '</option>'; }).join('');
    $('fFormat').value = selected || FORMATS[0];
  }
  function openSheet(id, focusResults){
    editingId = id || null;
    var it = id ? items.filter(function(x){ return x.id === id; })[0] : null;
    $('sheetTitle').textContent = it ? 'Закупка' : 'Новая закупка';
    $('sheetLead').textContent = it ? 'Изменения сохранятся для вас и компаньона.' : 'Заполните при покупке. Охват и подписчиков внесёте после выхода поста.';
    $('fAt').value = it ? (it.at || nowLocal()) : nowLocal();
    $('fChannel').value = it ? it.channel : '';
    $('fSubs').value = it && it.chSubs != null ? it.chSubs : '';
    $('fLink').value = it ? (it.link || '') : '';
    fillFormatOptions(it ? it.format : '');
    $('fPrice').value = it && it.price != null ? it.price : '';
    $('fContact').value = it ? (it.contact || '') : '';
    $('fReach').value = it && it.reach != null ? it.reach : '';
    $('fJoined').value = it && it.joined != null ? it.joined : '';
    $('fInvite').value = it ? (it.invite || '') : '';
    $('fNote').value = it ? (it.note || '') : '';
    var s = it ? status(it) : 'planned';
    $('resLead').textContent = s === 'due' ? 'Прошли сутки с выхода, внесите охват и подписчиков.' : s === 'running' ? 'Пост вышел менее суток назад, лучше внести через 24 часа.' : 'Внесите через сутки после выхода поста.';
    var del = $('delBtn'); del.style.display = it ? '' : 'none'; del.textContent = 'Удалить'; del.dataset.armed = '';
    $('overlay').classList.add('open');
    setTimeout(function(){ if (!it) $('fChannel').focus(); else if (focusResults) $('fReach').focus(); }, 60);
  }
  function closeSheet(){ $('overlay').classList.remove('open'); editingId = null; }
  function save(){
    var channel = $('fChannel').value.trim();
    var price = num($('fPrice').value);
    var at = $('fAt').value;
    if (!at) { toast('Укажите дату и время выхода'); $('fAt').focus(); return; }
    if (!channel) { toast('Укажите название канала'); $('fChannel').focus(); return; }
    if (price == null || price < 0) { toast('Укажите цену'); $('fPrice').focus(); return; }
    var prev = editingId ? items.filter(function(x){ return x.id === editingId; })[0] : null;
    var rec = {
      id: editingId || uid(), at: at, channel: channel,
      link: normLink($('fLink').value), chSubs: num($('fSubs').value),
      format: $('fFormat').value, price: price, contact: normContact($('fContact').value),
      reach: num($('fReach').value), joined: num($('fJoined').value),
      invite: $('fInvite').value.trim(), note: $('fNote').value.trim()
    };
    if (prev) { if (prev.updatedAt) rec.updatedAt = prev.updatedAt; if (prev.by) rec.by = prev.by; }
    if (JSON.stringify(rec).length > 3800) rec.note = rec.note.slice(0, 300);
    if (editingId) items = items.map(function(x){ return x.id === editingId ? rec : x; });
    else items.push(rec);
    persist(); closeSheet(); render(); toast('Сохранено');
  }

  // ---------- export ----------
  function csvCell(v){ var s = v == null ? '' : String(v); return '"' + s.replace(/"/g, '""') + '"'; }
  function exportCsv(){
    if (!items.length) { toast('Пока нечего выгружать'); return; }
    var head = ['Дата и время','Канал','Ссылка','Подписчиков в канале','Формат','Цена','Продавец','Охват','Пришло','CPS','CPM','CR %','ERR %','Пригласительная ссылка','Заметка'];
    var rows = items.slice().sort(function(a, b){ return ts(a) - ts(b); }).map(function(i){
      var cps = M.cps.fn(i), cpm = M.cpm.fn(i), cr = M.cr.fn(i), err = M.err.fn(i);
      return [fdt(i.at), i.channel, i.link, i.chSubs, i.format, i.price, i.contact, i.reach, i.joined,
        cps != null ? Math.round(cps) : '', cpm != null ? Math.round(cpm) : '',
        cr != null ? cr.toFixed(2) : '', err != null ? err.toFixed(1) : '', i.invite, i.note].map(csvCell).join(';');
    });
    var text = '\uFEFF' + [head.map(csvCell).join(';')].concat(rows).join('\r\n');
    if (inTg) { copyFallback(text); return; }
    try {
      var blob = new Blob([text], {type: 'text/csv;charset=utf-8'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'reklama.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      toast('Файл готов');
    } catch(e){ copyFallback(text); }
  }
  function copyFallback(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast('Таблица скопирована, вставьте её в Google Таблицы'); }, function(){ toast('Выгрузка недоступна в этом окне'); });
    } else { toast('Выгрузка недоступна в этом окне'); }
  }

  // ---------- main render ----------
  function setTab(t){
    S.tab = t;
    $('tabBuys').setAttribute('aria-selected', t === 'buys');
    $('tabStats').setAttribute('aria-selected', t === 'stats');
    $('viewBuys').hidden = t !== 'buys';
    $('viewStats').hidden = t !== 'stats';
    render();
    window.scrollTo(0, 0);
  }
  function render(){
    lastSig = items.map(status).join('');
    renderBanner();
    if (S.tab === 'buys') renderBuys(); else renderStats();
  }

  // ---------- events ----------
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });
  $('addBtn').addEventListener('click', function(){ openSheet(null); });
  $('glossBtn').addEventListener('click', showGlossary);
  $('sortSel').addEventListener('change', render);
  $('search').addEventListener('input', render);
  $('saveBtn').addEventListener('click', save);
  $('cancelBtn').addEventListener('click', closeSheet);
  $('exportBtn').addEventListener('click', exportCsv);
  $('infoClose').addEventListener('click', closeInfo);
  $('overlay').addEventListener('click', function(e){ if (e.target === $('overlay')) closeSheet(); });
  $('infoOverlay').addEventListener('click', function(e){ if (e.target === $('infoOverlay')) closeInfo(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeSheet(); closeInfo(); } });
  $('delBtn').addEventListener('click', function(){
    var b = $('delBtn');
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Точно удалить?'; return; }
    items = items.filter(function(x){ return x.id !== editingId; });
    persist(); closeSheet(); render(); toast('Удалено');
  });
  $('stPeriod').addEventListener('change', function(){ S.stPeriod = this.value; render(); });
  $('stFormat').addEventListener('change', function(){ S.stFormat = this.value; render(); });
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('[data-filter]'); if (!b) return;
    S.buyFilter = b.getAttribute('data-filter'); render();
  });
  $('banner').addEventListener('click', function(e){
    var b = e.target.closest('[data-due]'); if (b) openSheet(b.getAttribute('data-due'), true);
  });
  $('list').addEventListener('click', function(e){
    var card = e.target.closest('.card'); if (!card) return;
    var id = card.getAttribute('data-id');
    var info = e.target.closest('[data-info]');
    if (info) { showMetric(info.getAttribute('data-info'), id); return; }
    if (e.target.closest('[data-edit]')) openSheet(id, status(items.filter(function(x){ return x.id === id; })[0]) !== 'done');
  });
  $('stBody').addEventListener('click', function(e){
    var info = e.target.closest('[data-info]');
    if (info) { showMetric(info.getAttribute('data-info'), null); return; }
    var row = e.target.closest('[data-rowid]');
    if (row) { openSheet(row.getAttribute('data-rowid')); return; }
    if (e.target.id === 'rankDir') { S.rankDir = S.rankDir === 'best' ? 'worst' : 'best'; render(); return; }
    if (e.target.id === 'rankAll') { S.rankAll = !S.rankAll; render(); return; }
  });
  $('stBody').addEventListener('change', function(e){
    if (e.target.id === 'rankMetric') { S.rankMetric = e.target.value; render(); }
    else if (e.target.id === 'groupBy') { S.groupBy = e.target.value; render(); }
    else if (e.target.id === 'groupSort') { S.groupSort = e.target.value; render(); }
  });
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[data-ext]'); if (!a) return;
    e.preventDefault();
    var href = a.getAttribute('href');
    try {
      if (inTg) { if (/^https?:\/\/(t\.me|telegram\.me)\//i.test(href) && tg.openTelegramLink) tg.openTelegramLink(href); else tg.openLink(href); }
      else window.open(href, '_blank', 'noopener');
    } catch(err){ window.open(href, '_blank', 'noopener'); }
  });

  // ---------- start ----------
  items = readLocal();
  fillFormatOptions('');
  render(); setStatus();
  pull(true).catch(function(){ apiOn = false; storageMode = 'local'; setStatus(); });
  setInterval(function(){
    if (apiOn && !document.hidden) pull(false).catch(function(){});
    if (items.map(status).join('') !== lastSig) render();
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) return;
    if (apiOn) pull(false).catch(function(){});
    if (items.map(status).join('') !== lastSig) render();
  });
})();
</script>
</body>
</html>
